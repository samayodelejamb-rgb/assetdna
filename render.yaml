# One-click setup: Render dashboard > New > Blueprint > pick this repo > Apply.
# Creates a free PostgreSQL database and a free web service, and connects them. No env vars to type in.
databases:
  - name: assetdna-db
    databaseName: assetdna
    user: assetdna
    region: oregon
    plan: free
    ipAllowList: []        # only the web service (internal network) can reach the database
services:
  - type: web
    name: assetdna
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: assetdna-db
          property: connectionString
      - key: SEED_DEMO     # "0" = real system, no demo data. The first person to sign up becomes the Administrator.
        value: "0"
